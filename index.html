<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Data Kursus - Orang Tua</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; }
    label { font-weight: bold; display: block; margin-top: 15px; }
    select, input, button { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
    button { background-color: #007bff; color: white; font-weight: bold; cursor: pointer; border: none; margin-top: 15px; }
    button:hover { background-color: #0056b3; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
    th { background-color: #007bff; color: white; }
    .status { font-weight: bold; padding: 10px; margin-top: 15px; border-radius: 5px; display: none; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <h2>Cek Riwayat Kursus Siswa</h2>
  
  <div id="statusBox" class="status"></div>

  <label for="selectNama">Pilih Nama Siswa:</label>
  <select id="selectNama">
    <option value="">-- Memuat Daftar Siswa... --</option>
  </select>

  <button onclick="cariRiwayat()">Cari Riwayat</button>

  <table id="tabelRiwayat" style="display:none;">
    <thead>
      <tr>
        <th>Ptm Ke</th>
        <th>Tanggal</th>
        <th>Status</th>
        <th>Nominal</th>
        <th>Catatan</th>
      </tr>
    </thead>
    <tbody id="bodyTabel"></tbody>
  </table>
</div>

<script src="script.js"></script>
<script>
  // Muat daftar nama saat halaman terbuka
  document.addEventListener("DOMContentLoaded", initOrangTua);
</script>
</body>
</html>
