<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Data Kursus</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        
        <div class="card shadow-sm mb-4">
          <div class="card-body">
            <h3 class="card-title text-center text-primary mb-4">Data Pertemuan Siswa</h3>
            
            <!-- Input Cari Nama -->
            <div class="mb-3">
              <label for="searchNama" class="form-label fw-bold">Pilih / Cari Nama Siswa:</label>
              <input type="text" id="searchNama" class="form-control" list="studentOptions" placeholder="Ketik nama siswa..." autocomplete="off">
              <datalist id="studentOptions"></datalist>
            </div>

            <button id="btnCari" class="btn btn-primary w-100">Tampilkan Data</button>
          </div>
        </div>

        <!-- Indicator Loading -->
        <div id="loading" class="text-center d-none my-4">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-2 text-muted">Mengambil data dari Google Sheets...</p>
        </div>

        <!-- Tabel Hasil Riwayat -->
        <div id="resultCard" class="card shadow-sm d-none">
          <div class="card-header bg-white font-weight-bold">
            <h5 class="mb-0">Riwayat Pertemuan: <span id="namaSiswaTitle" class="text-primary"></span></h5>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Pertemuan</th>
                    <th>Tanggal</th>
                    <th>Status</th>
                    <th>Nominal</th>
                    <th>Catatan</th>
                  </tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Script JS Utama -->
  <script src="script.js"></script>
</body>
</html>
